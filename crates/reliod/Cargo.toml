[package]
name = "reliod"
description = "Relio daemon running on the Kobo e-reader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
getrandom = "0.2"
http-body-util = "0.1"
minisign-verify = "0.3"
relio-core = { path = "../relio-core" }
relio-kepub = { path = "../relio-kepub" }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "fs", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tower = { version = "0.5", features = ["util"] }
