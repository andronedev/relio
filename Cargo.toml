[workspace]
resolver = "3"
members = ["crates/relio-core", "crates/reliod", "crates/relio-kepub", "crates/kobo-touch"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.release]
# The daemon runs on a small e-reader: favour size and keep panics cheap.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
